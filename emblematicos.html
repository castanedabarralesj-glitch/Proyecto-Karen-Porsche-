<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche - Emblemáticos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Porsche</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="historia.html">Historia</a></li>
                    <li class="nav-item"><a class="nav-link active" href="emblematicos.html">Emblemáticos</a></li>
                    <li class="nav-item"><a class="nav-link" href="exclusivos.html">Exclusivos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="contenido">
        <section class="container py-5">

            <div class="encabezado text-center mb-5 entrada">
                <h1 class="fw-bold">Autos emblemáticos</h1>
                <p class="mt-3">Los modelos que hicieron famosa a Porsche.</p>
            </div>

            <div class="row g-3 mb-5 justify-content-center">
                <div class="col-12 col-md-5">
                    <input type="text" id="buscador" class="form-control" placeholder="Buscar auto por nombre">
                </div>
                <div class="col-12 col-md-4">
                    <select id="decada" class="form-select" aria-label="Filtrar por década">
                        <option value="todas">Todas las décadas</option>
                        <option value="1940">Años 40</option>
                        <option value="1960">Años 60</option>
                        <option value="1980">Años 80</option>
                        <option value="2000">Años 2000</option>
                        <option value="2010">Años 2010</option>
                    </select>
                </div>
            </div>

            <div id="mensaje" class="alert alert-warning text-center d-none">
                No hay autos con esa búsqueda.
            </div>

            <div id="lista" class="row g-4 justify-content-center" data-tipo="emblematicos"></div>

            <div class="text-center mt-5">
                <a href="index.html" class="btn boton boton-negro">Regresar</a>
            </div>

        </section>
    </main>

    <footer class="pie text-center py-3">
        <p class="mb-0">Porsche - Historia y autos de la marca</p>
    </footer>

    <button type="button" id="subir" class="btn boton subir" aria-label="Volver arriba">↑</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="efectos.js"></script>
    <script src="datos.js"></script>
    <script src="autos.js"></script>

</body>

</html>
